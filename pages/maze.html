<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze • AI Games Hub</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">AI <span class="accent">Games</span> Hub</div>
      <nav>
        <a href="/">Home</a>
        <a href="/pages/tictactoe.html">Tic-Tac-Toe</a>
        <a href="/pages/maze.html" class="active">Maze</a>
        <a href="/pages/sudoku.html">Sudoku</a>
        <a href="/pages/nqueens.html">N-Queens</a>
        <a href="/pages/treasure.html">Treasure</a>
        <a href="/pages/chess.html">Chess</a>
      </nav>
    </header>
    <main>
      <aside class="sidebar">
        <h2>Maze Info</h2>
        <div class="card">Generate a maze (DFS) and solve with A*.</div>
      </aside>
      <section class="content">
        <h2>Maze Escape</h2>
        <div class="row">
          <label>Rows <input id="maze-rows" type="number" min="2" max="50" value="10" /></label>
          <label>Cols <input id="maze-cols" type="number" min="2" max="50" value="10" /></label>
          <button class="btn" id="maze-generate">Generate</button>
          <button class="btn" id="maze-solve">Solve</button>
        </div>
        <div id="maze-grid" class="maze-grid" style="margin-top:12px"></div>
      </section>
    </main>
    <footer>© AI Games Hub.</footer>
    <script type="module" src="/assets/js/maze.js"></script>
  </body>
</html>
